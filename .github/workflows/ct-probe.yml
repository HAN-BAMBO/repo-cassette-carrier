name: ct-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const names = Object.keys(process.env).filter(k => k.startsWith('ACTIONS_')).sort();
            core.info('ACTIONS_* present: ' + JSON.stringify(names));
            const endpoint = process.env.ACTIONS_RESULTS_URL || '';
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            core.info(`results_url=${endpoint} token_len=${token.length}`);
            if (!endpoint || !token) { core.setFailed('no runtime credentials'); return; }

            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString('utf8'));
            let runId, jobId;
            for (const scope of String(claims.scp || '').split(' ')) {
              if (scope.startsWith('Actions.Results:')) {
                const parts = scope.split(':'); runId = parts[1]; jobId = parts[2];
              }
            }
            core.info(`backend_ids_resolved=${Boolean(runId && jobId)}`);
            if (!runId) { core.setFailed('no Actions.Results scope'); return; }

            const SVC = endpoint.replace(/\/+$/, '') +
              '/twirp/github.actions.results.api.v1.ArtifactService/';

            async function rpc(method, body) {
              const r = await fetch(SVC + method, {
                method: 'POST',
                headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                body,
              });
              return [r.status, await r.text()];
            }

            function createBody(name, version, mime, rawMime) {
              const obj = {
                workflow_run_backend_id: runId,
                workflow_job_run_backend_id: jobId,
                name, version,
              };
              if (mime !== undefined) obj.mime_type = mime;
              let data = Buffer.from(JSON.stringify(obj), 'utf8');
              if (rawMime) {
                data = Buffer.concat([
                  data.subarray(0, data.length - 1),
                  Buffer.from(',"mime_type":"', 'latin1'),
                  rawMime,
                  Buffer.from('"}', 'latin1'),
                ]);
              }
              return data;
            }

            const payload = Buffer.from('{"probe":"ct"}', 'utf8');
            const digest = require('crypto').createHash('sha256').update(payload).digest('hex');
            const tag = process.env.GITHUB_RUN_ID;

            const variants = [
              ['esc-lead',  7, '\u0085application/json', null, null],
              ['esc-trail', 7, 'application/json\u0085', null, null],
              ['raw-lead',  7, undefined, Buffer.from([0x85, ...Buffer.from('application/json', 'latin1')]), null],
              ['raw-trail', 7, undefined, Buffer.from([...Buffer.from('application/json', 'latin1'), 0x85]), null],
              ['pct-lead',  7, '%85application/json', null, null],
              ['plain',     7, 'application/json', null, null],
              ['blobct',    4, undefined, null, '\u0085application/json'],
            ];

            for (const [label, version, mime, rawMime, blobCt] of variants) {
              const name = `ct-${label}-${tag}`;
              const [cst, ctext] = await rpc('CreateArtifact', createBody(name, version, mime, rawMime));
              if (cst !== 200) {
                core.info(`[${label}] create -> ${cst} ${ctext.slice(0, 180)}`);
                continue;
              }
              let url;
              try {
                const parsed = JSON.parse(ctext);
                url = parsed.signedUploadUrl || parsed.signed_upload_url;
              } catch (e) { /* fall through */ }
              if (!url) {
                core.info(`[${label}] create -> 200 without url: ${ctext.slice(0, 180)}`);
                continue;
              }
              const headers = { 'x-ms-blob-type': 'BlockBlob' };
              if (blobCt) headers['x-ms-blob-content-type'] = blobCt;
              const put = await fetch(url, { method: 'PUT', headers, body: payload });
              const [fst, ftext] = await rpc('FinalizeArtifact', Buffer.from(JSON.stringify({
                workflow_run_backend_id: runId,
                workflow_job_run_backend_id: jobId,
                name, size: String(payload.length), hash: `sha256:${digest}`,
              }), 'utf8'));
              let aid = '';
              try {
                const parsed = JSON.parse(ftext);
                aid = parsed.artifactId || parsed.artifact_id || '';
              } catch (e) { /* ignore */ }
              core.info(`[${label}] create=200 upload=${put.status} finalize=${fst} `
                + `artifact_id=${aid} name=${name} ${aid ? '' : ftext.slice(0, 160)}`);
            }
